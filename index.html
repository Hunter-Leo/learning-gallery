<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Gallery</title>
  <link rel="stylesheet" href="shared/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--void-black);
      color: var(--whisper-white);
      font-family: var(--font-primary);
      min-height: 100vh;
      padding: 60px 40px;
    }

    header {
      max-width: 1200px;
      margin: 0 auto 40px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: var(--muted-silver);
      font-size: 18px;
      margin-bottom: 32px;
    }

    /* GitHub Info Section */
    .github-info {
      max-width: 1200px;
      margin: 0 auto 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
    }

    .github-stats {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .stat-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--soft-mist);
      border: 1px solid var(--gentle-glow);
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
    }

    .stat-badge svg {
      width: 16px;
      height: 16px;
    }

    .stat-badge .count {
      font-weight: 600;
      color: var(--whisper-white);
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--github-green);
      color: white;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: opacity var(--transition-base);
    }

    .github-link:hover {
      opacity: 0.9;
    }

    .github-link svg {
      width: 18px;
      height: 18px;
    }

    /* Recent Updates Section */
    .recent-updates {
      max-width: 1200px;
      margin: 0 auto 60px;
      background: var(--soft-mist);
      border: 1px solid var(--gentle-glow);
      border-radius: var(--radius-lg);
      padding: 24px;
    }

    .recent-updates h3 {
      font-size: 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .update-list {
      list-style: none;
    }

    .update-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--gentle-glow);
    }

    .update-item:last-child {
      border-bottom: none;
    }

    .update-icon {
      width: 20px;
      height: 20px;
      color: var(--accent-cyan);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .update-content {
      flex: 1;
    }

    .update-message {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .update-meta {
      font-size: 12px;
      color: var(--muted-silver);
    }

    /* Deck Grid */
    .deck-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .deck-card {
      background: var(--soft-mist);
      border: 1px solid var(--gentle-glow);
      border-radius: var(--radius-lg);
      padding: 32px;
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }

    .deck-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-glow);
    }

    .deck-card h2 {
      font-size: 24px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .deck-card p {
      color: var(--muted-silver);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tag {
      background: var(--gentle-glow);
      color: var(--muted-silver);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 13px;
    }

    .deck-link {
      display: inline-block;
      background: var(--accent-cyan);
      color: var(--void-black);
      padding: 10px 24px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: opacity var(--transition-base);
    }

    .deck-link:hover {
      opacity: 0.9;
    }

    .loading {
      text-align: center;
      color: var(--muted-silver);
      padding: 60px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Learning Gallery</h1>
    <p class="subtitle">Claude Code Learning Content Collection</p>
  </header>

  <!-- GitHub Info Section -->
  <section class="github-info">
    <div class="github-stats">
      <div class="stat-badge">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 .25a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0V1A.75.75 0 018 .25zm0 13a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 018 13.25z"/>
        </svg>
        <span>Stars:</span>
        <span class="count" id="starCount">-</span>
      </div>
      <div class="stat-badge">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75v-.878a2.25 2.25 0 111.5 0v.878a2.25 2.25 0 01-2.25 2.25h-1.5v2.128a2.251 2.251 0 11-1.5 0V8.5h-1.5A2.25 2.25 0 013 6.25v-.878a2.25 2.25 0 111.5 0zM5 3.25a.75.75 0 10-1.5 0 .75.75 0 001.5 0zm6.75.75a.75.75 0 100-1.5.75.75 0 000 1.5z"/>
        </svg>
        <span>Forks:</span>
        <span class="count" id="forkCount">-</span>
      </div>
    </div>
    <a href="#" class="github-link" id="githubLink" target="_blank">
      <svg viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      GitHub Repository
    </a>
  </section>

  <!-- Recent Updates Section -->
  <section class="recent-updates">
    <h3>
      <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 1.5a6.5 6.5 0 100 13 6.5 6.5 0 000-13zM0 8a8 8 0 1116 0A8 8 0 010 8z"/>
        <path d="M8 3.25a.75.75 0 01.75.75v3.25H11a.75.75 0 010 1.5H7.25V4A.75.75 0 018 3.25z"/>
      </svg>
      Recent Updates
    </h3>
    <ul class="update-list" id="updateList">
      <li class="loading">Loading...</li>
    </ul>
  </section>

  <!-- Deck Grid -->
  <main class="deck-grid" id="deckGrid">
    <div class="loading">Loading presentations...</div>
  </main>

  <script>
    // GitHub repository info
    const GITHUB_REPO = 'Hunter-Leo/learning-gallery';

    // Load GitHub stats
    async function loadGitHubStats() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}`);
        const data = await response.json();

        document.getElementById('starCount').textContent = data.stargazers_count || 0;
        document.getElementById('forkCount').textContent = data.forks_count || 0;
        document.getElementById('githubLink').href = data.html_url;
      } catch (error) {
        console.error('Failed to load GitHub stats:', error);
        document.getElementById('starCount').textContent = 'N/A';
        document.getElementById('forkCount').textContent = 'N/A';
      }
    }

    // Load recent updates
    async function loadRecentUpdates() {
      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/commits?per_page=5`);
        const commits = await response.json();

        const updateList = document.getElementById('updateList');
        updateList.innerHTML = commits.map(commit => `
          <li class="update-item">
            <svg class="update-icon" viewBox="0 0 16 16" fill="currentColor">
              <path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75v-.878a2.25 2.25 0 111.5 0v.878a2.25 2.25 0 01-2.25 2.25h-1.5v2.128a2.251 2.251 0 11-1.5 0V8.5h-1.5A2.25 2.25 0 013 6.25v-.878a2.25 2.25 0 111.5 0z"/>
            </svg>
            <div class="update-content">
              <div class="update-message">${commit.commit.message}</div>
              <div class="update-meta">
                ${commit.commit.author.name} · ${new Date(commit.commit.author.date).toLocaleDateString('zh-CN')}
              </div>
            </div>
          </li>
        `).join('');
      } catch (error) {
        console.error('Failed to load recent updates:', error);
        updateList.innerHTML = '<li class="update-item">Unable to load updates</li>';
      }
    }

    // Load decks
    async function loadDecks() {
      const grid = document.getElementById('deckGrid');

      const decks = [
        {
          id: 'claude-code-marketplace',
          title: 'Claude Code Marketplace',
          description: 'Plugin ecosystem deep dive - Complete guide to Plugin, Skills, Agents, Hooks',
          tags: ['Claude Code', 'Plugin', 'Skills'],
          path: 'decks/claude-code-marketplace/'
        },
        {
          id: 'agent-workflows',
          title: 'Agent Workflows Comparison',
          description: 'Deep comparison of four major plugin workflows - Superpowers, gstack, OMC, ECC',
          tags: ['Agent', 'Workflow', 'Comparison'],
          path: 'decks/agent-workflows/'
        },
        {
          id: 'taskapp-framework-release',
          title: 'taskapp-framework v0.3.0 Release',
          description: '基于 FastAPI + FastMCP + RQ 的异步任务框架 - 特性详解、快速入门、Agent Skill 与配置',
          tags: ['Python', 'FastAPI', 'MCP', 'Framework'],
          path: 'decks/taskapp-framework-release/'
        }
      ];

      grid.innerHTML = decks.map(deck => `
        <article class="deck-card">
          <h2>${deck.title}</h2>
          <p>${deck.description}</p>
          <div class="tags">
            ${deck.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
          <a href="${deck.path}" class="deck-link">View Presentation</a>
        </article>
      `).join('');
    }

    // Initialize
    loadGitHubStats();
    loadRecentUpdates();
    loadDecks();
  </script>
</body>
</html>
