<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>01 · Matt Pocock Skills</title>
<link rel="stylesheet" href="/decks/matt-pocock-skills/shared/tokens.css">
<style>
  body { background: var(--canvas); }
  .cover {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 100px 160px;
  }

  /* Subtle warm gradient texture */
  .cover::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(217,119,87,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 80% 80%, rgba(217,119,87,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .cover-badge {
    font-family: var(--font-body);
    font-size: var(--text-xs);
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(217,119,87,0.3);
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: var(--space-2xl);
  }

  .cover h1 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: var(--text-hero);
    color: var(--on-dark);
    line-height: 1.08;
    margin-bottom: var(--space-lg);
    letter-spacing: -0.01em;
  }

  .cover h1 .accent {
    color: var(--accent);
    position: relative;
  }

  .cover h1 .accent::after {
    content: '';
    position: absolute;
    bottom: 4px;
    left: 0;
    right: 0;
    height: 4px;
    background: var(--accent);
    opacity: 0.3;
    border-radius: 2px;
  }

  .cover .subtitle {
    font-family: var(--font-english);
    font-size: var(--text-xl);
    font-style: italic;
    color: var(--on-dark-soft);
    margin-bottom: var(--space-2xl);
    max-width: 700px;
    line-height: 1.6;
  }

  .cover .meta-row {
    display: flex;
    align-items: center;
    gap: var(--space-lg);
    font-size: var(--text-sm);
    color: var(--on-dark-soft);
  }

  .cover .meta-row .dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--muted-soft);
  }

  .cover .tag-row {
    display: flex;
    gap: var(--space-md);
    margin-top: var(--space-2xl);
  }

  .cover .tag-row span {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    border: 1px solid rgba(217,119,87,0.25);
    padding: 4px 14px;
    border-radius: 999px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="cover-badge">Skills for Real Engineers</div>
  <h1>Matt Pocock <span class="accent">Skills</span></h1>
  <p class="subtitle">Straight from my .claude directory</p>
  <div class="meta-row">
    <span>github.com/mattpocock/skills</span>
    <span class="dot"></span>
    <span>Open Source</span>
    <span class="dot"></span>
    <span>Claude Code · Codex</span>
  </div>
  <div class="tag-row">
    <span>Engineering</span>
    <span>Productivity</span>
    <span>Misc</span>
  </div>
</div>
</body>
</html>
