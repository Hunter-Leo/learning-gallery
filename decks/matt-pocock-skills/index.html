<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Matt Pocock Skills</title>
<script>
window.DECK_MANIFEST = [
  { file: "slides/01-cover.html",              label: "封面" },
  { file: "slides/02-section-philosophy.html", label: "Design Philosophy" },
  { file: "slides/03-four-failure-modes.html", label: "四大失败模式" },
  { file: "slides/04-skill-architecture.html", label: "技能体系架构" },
  { file: "slides/05-section-alignment.html",  label: "Alignment" },
  { file: "slides/06-grill-with-docs.html",    label: "Grill-with-Docs" },
  { file: "slides/07-to-prd-issues.html",      label: "To-PRD + To-Issues" },
  { file: "slides/08-section-implementation.html", label: "Implementation" },
  { file: "slides/09-tdd.html",                label: "TDD" },
  { file: "slides/10-diagnose.html",           label: "Diagnose" },
  { file: "slides/11-architecture-prototype.html", label: "Architecture + Prototype" },
  { file: "slides/12-productivity.html",       label: "Productivity Tools" },
  { file: "slides/13-workflow-pipeline.html",  label: "Workflow Pipeline" },
  { file: "slides/14-section-community.html",  label: "Community" },
  { file: "slides/15-github-phenomenon.html",  label: "GitHub Phenomenon" },
  { file: "slides/16-adoption-patterns.html",  label: "Adoption Patterns" },
  { file: "slides/17-criticism-ecosystem.html", label: "Criticism & Ecosystem" },
  { file: "slides/18-summary.html",            label: "Summary" },
];

window.DECK_WIDTH = 1920;
window.DECK_HEIGHT = 1080;
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #181715;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  #stage {
    position: fixed;
    top: 0; left: 0;
    transform-origin: 0 0;
    box-shadow: 0 10px 60px rgba(0,0,0,0.5);
  }
  #transition-overlay {
    position: fixed;
    inset: 0;
    background: #181715;
    pointer-events: none;
    opacity: 0;
    z-index: 200;
    transition: opacity 0.15s ease;
  }
  #transition-overlay.active { opacity: 1; transition: opacity 0.1s ease; }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #181715;
  }
  .counter {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(0,0,0,0.7);
    color: #c4c1b9;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    z-index: 100;
    user-select: none;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .counter:hover { opacity: 1; }
  .counter .label { color: rgba(255,255,255,0.5); margin-left: 8px; }
  .nav-zone {
    position: fixed;
    top: 0; bottom: 0;
    width: 15%;
    cursor: pointer;
    z-index: 50;
  }
  .nav-zone.left  { left: 0; }
  .nav-zone.right { right: 0; }
  .nav-hint {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .nav-zone.left  .nav-hint { left: 20px; }
  .nav-zone.right .nav-hint { right: 20px; }
  .nav-zone:hover .nav-hint { opacity: 1; }
  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { background: #181715; overflow: visible; height: auto; }
    #stage { position: static; zoom: 1 !important; transform: none !important; box-shadow: none; }
    .counter, .nav-zone { display: none !important; }
    .print-stack { display: block; }
    .print-stack iframe {
      width: 1920px;
      height: 1080px;
      page-break-after: always;
      display: block;
      background: #181715;
    }
  }
</style>
</head>
<body>

<div id="stage">
  <iframe id="frame" src="about:blank"></iframe>
</div>
<div id="transition-overlay"></div>
<div class="nav-zone left"  id="navL"><div class="nav-hint">‹</div></div>
<div class="nav-zone right" id="navR"><div class="nav-hint">›</div></div>
<div class="counter" id="counter">1 / 1</div>
<div class="print-stack" id="printStack" style="display:none;"></div>

<script>
(function () {
  const W = window.DECK_WIDTH || 1920;
  const H = window.DECK_HEIGHT || 1080;
  const deck = window.DECK_MANIFEST || [];
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const counter = document.getElementById('counter');
  const printStack = document.getElementById('printStack');
  const storageKey = 'deck-index-' + location.pathname;
  let current = 0;

  stage.style.width  = W + 'px';
  stage.style.height = H + 'px';

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.zoom = s;
    stage.style.transform = 'none';
    stage.style.left = Math.round((window.innerWidth - W * s) / 2) + 'px';
    stage.style.top  = Math.round((window.innerHeight - H * s) / 2) + 'px';
  }

  const overlay = document.getElementById('transition-overlay');
  let transitioning = false;

  function show(idx) {
    if (idx < 0 || idx >= deck.length) return;
    if (transitioning) return;
    transitioning = true;
    overlay.classList.add('active');

    setTimeout(() => {
      current = idx;
      counter.innerHTML = `${idx + 1} / ${deck.length} <span class="label">${deck[idx].label || ''}</span>`;
      try { localStorage.setItem(storageKey, String(idx)); } catch (_) {}
      if (location.hash !== '#' + (idx + 1)) {
        history.replaceState(null, '', '#' + (idx + 1));
      }

      function onLoad() {
        frame.removeEventListener('load', onLoad);
        requestAnimationFrame(() => {
          overlay.classList.remove('active');
          transitioning = false;
        });
      }
      frame.addEventListener('load', onLoad);

      // file:// 协议直接加载 .html，Vercel 用 cleanUrl + trailingSlash
      let slideSrc = deck[idx].file;
      if (location.protocol !== 'file:') {
        slideSrc = slideSrc.replace(/\.html$/, '');
        if (!slideSrc.endsWith('/')) slideSrc += '/';
      }
      frame.src = slideSrc;

      setTimeout(() => {
        if (transitioning) {
          overlay.classList.remove('active');
          transitioning = false;
        }
      }, 3000);
    }, 120);
  }

  function next() { show(Math.min(current + 1, deck.length - 1)); }
  function prev() { show(Math.max(current - 1, 0)); }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft':  case 'PageUp':              e.preventDefault(); prev(); break;
      case 'Home':                                    e.preventDefault(); show(0); break;
      case 'End':                                     e.preventDefault(); show(deck.length - 1); break;
      case 'p': case 'P':                             window.print(); break;
      default:
        if (e.key >= '1' && e.key <= '9') {
          const i = parseInt(e.key, 10) - 1;
          if (i < deck.length) { e.preventDefault(); show(i); }
        }
    }
  });

  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#(\d+)$/);
    if (m) show(parseInt(m[1], 10) - 1);
  });

  const hashMatch = location.hash.match(/^#(\d+)$/);
  if (hashMatch) current = Math.min(parseInt(hashMatch[1], 10) - 1, deck.length - 1);
  else try {
    const v = parseInt(localStorage.getItem(storageKey), 10);
    if (!isNaN(v) && v >= 0 && v < deck.length) current = v;
  } catch (_) {}
  fit();
  show(current);

  window.addEventListener('beforeprint', () => {
    printStack.innerHTML = '';
    deck.forEach(item => {
      const f = document.createElement('iframe');
      f.src = item.file;
      printStack.appendChild(f);
    });
    printStack.style.display = 'block';
    document.getElementById('stage').style.display = 'none';
  });
  window.addEventListener('afterprint', () => {
    printStack.innerHTML = '';
    printStack.style.display = 'none';
    document.getElementById('stage').style.display = '';
  });
})();
</script>

</body>
</html>
