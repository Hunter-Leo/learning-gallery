<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>01 · 封面</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/tokens.css">
<style>
  body { background: var(--bg-base); }

  .cover {
    width: 100%; height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    position: relative;
    overflow: hidden;
  }

  /* 左侧主内容 */
  .cover-left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 100px 80px 100px 100px;
    position: relative;
    z-index: 2;
  }

  /* 右侧装饰区 */
  .cover-right {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* 右侧嵌套圆圈装饰 */
  .deco-rings {
    position: absolute;
    width: 700px; height: 700px;
    right: -100px;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .ring-1 { width: 680px; height: 680px; border-color: rgba(245,158,11,0.08); }
  .ring-2 { width: 520px; height: 520px; border-color: rgba(245,158,11,0.12); }
  .ring-3 { width: 360px; height: 360px; border-color: rgba(245,158,11,0.18); }
  .ring-4 { width: 200px; height: 200px; border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.04); }

  /* 右侧浮动 badge */
  .float-badges {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .fb {
    position: absolute;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border: 1px solid;
    font-family: var(--font-mono);
    backdrop-filter: blur(4px);
  }

  .fb-marketplace { top: 15%;  left: 20%; border-color: var(--marketplace-color); color: var(--marketplace-color); background: rgba(245,158,11,0.08); }
  .fb-plugin      { top: 28%;  right: 15%; border-color: var(--plugin-color);  color: var(--plugin-color);  background: rgba(167,139,250,0.08); }
  .fb-skill       { top: 44%;  left: 10%; border-color: var(--skill-color);   color: var(--skill-color);   background: rgba(52,211,153,0.08); }
  .fb-agent       { top: 58%;  right: 20%; border-color: var(--agent-color);   color: var(--agent-color);   background: rgba(96,165,250,0.08); }
  .fb-hook        { top: 70%;  left: 25%; border-color: var(--hook-color);    color: var(--hook-color);    background: rgba(251,191,36,0.08); }
  .fb-command     { top: 80%;  right: 10%; border-color: var(--command-color); color: var(--command-color); background: rgba(244,114,182,0.08); }
  .fb-mcp         { top: 88%;  left: 15%; border-color: var(--mcp-color);     color: var(--mcp-color);     background: rgba(34,211,238,0.08); }

  /* 左侧内容 */
  .logo-mark {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 52px;
  }

  /* Anthropic A\ 标志近似 */
  .anthropic-symbol {
    width: 36px; height: 36px;
    position: relative;
    flex-shrink: 0;
  }

  .anthropic-symbol svg { width: 100%; height: 100%; }

  .logo-text {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .logo-sep {
    width: 1px; height: 20px;
    background: var(--border);
  }

  .product-name {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--claude-orange);
  }

  h1 {
    font-size: 88px;
    color: var(--text-primary);
    margin-bottom: 24px;
    line-height: 1.05;
  }

  h1 .hl { color: var(--claude-orange); }

  .subtitle {
    font-size: 22px;
    color: var(--text-secondary);
    margin-bottom: 56px;
    line-height: 1.6;
    max-width: 520px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 20px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-muted);
  }

  .meta-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--border); }

  /* 左侧竖线装饰 */
  .left-bar {
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 200px;
    background: linear-gradient(to bottom, transparent, var(--claude-orange), transparent);
  }
</style>
<script src="../../shared/slide-fx.js"></script>
</head>
<body>
<div class="cover">
  <div class="cover-left">
    <div class="left-bar"></div>

    <div class="logo-mark">
      <!-- Anthropic A\ 标志 SVG 近似 -->
      <div class="anthropic-symbol">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 4L32 30H4L18 4Z" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/>
          <line x1="22" y1="12" x2="28" y2="28" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
        </svg>
      </div>
      <span class="logo-text">Anthropic</span>
      <div class="logo-sep"></div>
      <span class="product-name">Claude Code</span>
    </div>

    <h1>如何从头<br>构建 <span class="hl">Marketplace</span></h1>

    <p class="subtitle">从零到一打造 Claude Code 扩展生态系统——Plugins、Skills、Agents、Hooks、Commands、MCP 全特性实战</p>

    <div class="meta-row">
      <span>Extension Ecosystem</span>
      <div class="meta-dot"></div>
      <span>教学幻灯片</span>
      <div class="meta-dot"></div>
      <span>2026</span>
    </div>
  </div>

  <div class="cover-right">
    <div class="deco-rings">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="ring ring-4"></div>
    </div>
    <div class="float-badges">
      <div class="fb fb-marketplace">Marketplace</div>
      <div class="fb fb-plugin">Plugin</div>
      <div class="fb fb-skill">Skills</div>
      <div class="fb fb-agent">Agents</div>
      <div class="fb fb-hook">Hooks</div>
      <div class="fb fb-command">Commands</div>
      <div class="fb fb-mcp">MCP</div>
    </div>
  </div>
</div>

<div class="page-footer">
  <span>Claude Code Marketplace · 教学幻灯片</span>
  <span>2026</span>
</div>
</body>
</html>
